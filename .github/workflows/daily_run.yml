name: Daily FII Data Fetcher
run-name: FII Fetcher - ${{ github.event.schedule && 'Scheduled' || 'Manual' }} - Run #${{ github.run_number }} (${{ github.event.repository.updated_at }})

on:
  schedule:
    # UTC समय के अनुसार दोपहर 1:30 PM (IST शाम 7:00 PM)
    - cron: '30 20 * * 1-5'
  workflow_dispatch:

jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install requests pandas

      - name: Run Script
        run: python fii_tracker.py
